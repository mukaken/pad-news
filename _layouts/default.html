<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | escape }} | {{ site.title }}</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#172d39;background:#fcfbf7;font:17px/1.85 "Inter","Yu Gothic",sans-serif}header,main,footer{width:min(90%,800px);margin:auto}header{border-bottom:3px solid #153e48;padding:24px 0 15px}header a{color:#153e48;font-weight:850;text-decoration:none;font-size:23px}main{padding:40px 0 48px;min-height:60vh}h1{font-size:clamp(32px,5vw,52px);line-height:1.24;letter-spacing:-.045em;margin:12px 0 24px}h2{line-height:1.5;font-size:23px}a{color:#00665f;text-underline-offset:.2em}time,small{font-size:14px;color:#4e645e}.entry{border-top:1px solid #afbab3;padding:24px 0}.entry h2{margin:6px 0}.entry p{margin:6px 0}footer{border-top:1px solid #afbab3;padding:16px 0 32px}article p{margin:1em 0}
</style>
<header><a href="{{ '/' | relative_url }}">PADニュース</a></header>
<main>{% if page.date %}<article><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y年%m月%d日" }}</time><h1>{{ page.title | escape }}</h1>{{ content }}</article><p><a href="{{ '/' | relative_url }}">記事一覧へ戻る</a></p>{% else %}{{ content }}{% endif %}</main>
<footer><small>Power Automate for desktop の非公式ニュースブログ</small></footer>
</html>
